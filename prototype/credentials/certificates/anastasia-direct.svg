<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Сертификат Анастасии по Яндекс Директу</title><desc id="desc">Демонстрационный макет сертификата для прототипа.</desc>
  <rect width="1200" height="800" fill="#f8f6f1"/><rect x="46" y="46" width="1108" height="708" rx="28" fill="none" stroke="#465a76" stroke-width="4"/>
  <circle cx="136" cy="138" r="48" fill="#fc3f1d"/><text x="136" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#fff">Я</text>
  <text x="220" y="120" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#465a76" letter-spacing="3">СЕРТИФИКАТ СПЕЦИАЛИСТА</text>
  <text x="220" y="170" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#181816">Яндекс Директ</text>
  <text x="80" y="330" font-family="Arial,sans-serif" font-size="22" fill="#6b6b65">Сертификат подтверждает профессиональную квалификацию</text>
  <text x="80" y="410" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#181816">Анастасия</text>
  <line x1="80" y1="454" x2="1120" y2="454" stroke="#d8d2c7" stroke-width="2"/>
  <text x="80" y="530" font-family="Arial,sans-serif" font-size="24" fill="#465a76">Действителен до 30.08.2027</text><text x="1120" y="530" text-anchor="end" font-family="Arial,sans-serif" font-size="24" fill="#465a76">№ A1-D-2026-001</text>
  <text x="600" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#465a76" opacity="0.45" letter-spacing="5">ДЕМОНСТРАЦИОННЫЙ МАКЕТ</text>
</svg>
