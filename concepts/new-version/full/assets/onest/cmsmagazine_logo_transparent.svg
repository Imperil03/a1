<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="670" height="92" viewBox="0 42 670 92" role="img" aria-label="CMS magazine logo">
  <title>CMS magazine</title>
  <rect width="820" height="220" fill="none"/>

  <!-- Red CMS block -->
  <rect x="0" y="42" width="285" height="92" rx="0" fill="#c8102e"/>
  <text x="18" y="112"
        font-family="Arial Black, Impact, Helvetica, Arial, sans-serif"
